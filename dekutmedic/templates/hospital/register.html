{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Signup</title>

    <link rel="stylesheet" href="{% static 'css/bootstrap-5.0.2-dist/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="main-wrapper login-body">
        <div class="login-wrapper">
            <div class="container">
                <div class="loginbox">
                    <div class="login-left">
                        <p>Dekut Medical Center</p>
                    </div>

                    <div class="login-right">
                        <div class="login-right-wrap">
                            <h1>Sign Up</h1>
                            <form action="" method="POST" enctype="multipart/form-data">
                                {% csrf_token %}
                                <div class="form-group">
                                    <label>Profile Pic</label>
                                    <input type="file" class="form-control" name="profile_pic" required="true">
                                </div>
                                <div class="form-group">
                                    <label> First Name </label>
                                    <input type="text" class="form-control" name="first_name" placeholder="st. Leo" required="true">
                                </div>
                                <div class="form-group">
                                    <label>Last Name</label>
                                    <input type="text" class="form-control" name="last_name" placeholder="Hospital">
                                </div>
                                <div class="form-group">
                                    <label> Email</label>
                                    <input type="email" class="form-control"  name="email" placeholder="stleo@gmail.com" required="true">
                                </div>
                                <div class="form-group">
                                    <label>Username</label>
                                    <input  type="text" class="form-control" name="username" placeholder="username" required="true">
                                </div>
                                <div class="form-group">
                                    <label>Location</label>
                                    <input type="text" class="form-control" name="location" placeholder="Nyeri" required="true">
                                </div>
                                <div class="form-group">
                                    <label >Password</label>
                                    <input type="password" class="form-control" name="password" required="true">
                                </div>
                                <div class="form-group mt-3" >
                                    <button class="btn btn-primary btn-block" type="submit" >Register</button>
                                </div>
                            </form>
                            <div class="text-center already-have"><a href="{% url 'login' %}">Already have an account? Click me</a></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
        <script src="{% static 'css/bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
